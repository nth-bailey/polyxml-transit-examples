[workspace]
name = "gtfs-siri-transit-bridge"
schemas = ["schemas/transit/siri_core.xsd"]
output_base_dir = "generated"
custom_header = "// Open Transit Data (GTFS-RT / SIRI) // Generated by PolyXML."

[[generate]]
target = "rust"
output = "rust"
zero_copy = true
codecs = true

[[generate]]
target = "python"
output = "python"
backend = "dataclass"
codecs = true

[[generate]]
target = "go"
output = "go"
package = "siri"
backend = "sonic"

[[generate]]
target = "cpp"
output = "cpp"

[[generate]]
target = "java"
output = "java"
package = "com.transit.siri"

[[generate]]
target = "typescript"
output = "typescript"
zod = true

[[generate]]
target = "csharp"
output = "csharp"
namespace = "Transit.Siri"
source_gen = true


